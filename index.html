<!doctype html>
<html lang="en" class="h-full">

    <div id="app" class=" gap-10 flex flex-col max-w-300 m-auto">

        </button>
        </nav>
      </header>

      <main class="flex flex-col justify-center gap-10 m-auto">

        <section class="flex gap-2">
          <button id="move-to-focus" class="top-indicator">Focus</button>
          <button id="move-to-short-break" class="top-indicator">Short Break</button>
          <button id="move-to-long-break" class="top-indicator">Long Break</button>
        </section>

        <section class="flex items-center justify-center m-auto">
          <div class="border rounded-[50%] px-20 py-24 flex flex-col gap-4">
            <h1 id="time-display" class="font-semibold text-6xl"></h1>
            <p id="session-objective">Deep Coding Session</p>
          </div>
        </section>

        <section>
          <div class="flex gap-2 justify-center">
            <div class="grid grid-cols-3 gap-2">
              <button id="start-session" class="rounded border p-1.5 text-start flex gap-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" wi  dth="28px" fill="currentColor"><path d="M340-236.16v-487.68L723.07-480 340-236.16ZM400-480Zm0 134 210.77-134L400-614v268Z"/></svg>
                <span>Start</span>
              </button>
              <button id="pause-session" class="border p-1.5 text-start rounded flex gap-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px" fill="currentColor"><path d="M530-220v-520h210v520H530Zm-310 0v-520h210v520H220Zm370-60h90v-400h-90v400Zm-310 0h90v-400h-90v400Zm0-400v400-400Zm310 0v400-400Z"/></svg>
                <span>Pause</span>
                </button>
              <button id="reset-session" class="border p-1.5 text-start rounded flex gap-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px" fill="currentColor"><path d="M480-333.85v-91.92q0-22.6 15.82-38.41Q511.63-480 534.23-480h91.92v47.69h-98.46v98.46H480ZM534.23-100q-22.6 0-38.41-15.82Q480-131.64 480-154.23v-91.92h47.69v98.46h98.46V-100h-91.92Zm278.08-233.85v-98.46h-98.46V-480h91.92q22.59 0 38.41 15.82Q860-448.37 860-425.77v91.92h-47.69ZM713.85-100v-47.69h98.46v-98.46H860v91.92q0 22.59-15.82 38.41Q828.36-100 805.77-100h-91.92Zm94.07-467.69h-62.23q-27.54-84.54-99.57-138.43Q574.08-760 480-760q-117 0-198.5 81.5T200-480q0 78.15 38.46 141.81 38.46 63.65 101.54 99.34V-360h60v220H180v-60h113.23q-69.3-45-111.27-118.27Q140-391.54 140-480q0-70.8 26.77-132.63t72.77-107.83q46-46 107.83-72.77Q409.2-820 480-820q118.61 0 208.81 71.42Q779-677.15 807.92-567.69Z"/></svg>
                <span>Reset</span>
              </button>
            </div>


            <button id="skip-session" class="hidden">Skip</button>
          </div>
        </section>

        <section class="border p-3 rounded-2xl">
          <p>Session Progress</p>
          <div id="session-progress"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
