      <main class="flex flex-col justify-center gap-10 m-auto">

        <section class="flex gap-2">
          <button id="move-to-focus" class="top-indicator">Focus</button>
          <button id="move-to-short-break" class="top-indicator">Short Break</button>
          <button id="move-to-long-break" class="top-indicator">Long Break</button>
        </section>

        <section class="flex items-center justify-center m-auto">
          <div class="border rounded-[50%] px-20 py-24 flex flex-col gap-4">
            <h1 id="time-display" class="font-semibold text-6xl"></h1>
            <p id="session-objective">Deep Coding Session</p>
          </div>
        </section>

        <section>
          <div class="flex gap-2 justify-center">
            <div class="flex gap-2">
              <button id="start-session" class="rounded border p-1.5 w-28 text-start flex gap-0.5">

              </button>
              <button id="pause-session" class="border p-1.5 text-start rounded hidden">Pause</button>
            </div>

            <button id="reset-session" class="hidden">Reset</button>
            <button id="skip-session" class="hidden">Skip</button>
          </div>
        </section>

        <section class="border p-3 rounded-2xl">
          <p>Session Progress</p>
          <div id="session-progress"></div>
        </section>
      </main>
    </div>
